<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light">
	<title>Генератор паролей</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;700&display=swap">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<div class="container">
		<h1 class="title">Генератор пароля</h1>

		<main class="section">
			<div class="length-box">
				<label class="set-input" for="passlength">Длина пароля</label>
				<div class="length">
					<input class="range" type="range" id="range" min="1" max="64" value="16" aria-label="Длина пароля, ползунок">
					<input class="length-input" type="number" id="passlength" min="1" max="64" value="16" inputmode="numeric">
				</div>
				<p class="hint">от 1 до 64 символов</p>
			</div>

			<div class="ready-passwords">
				<ul class="pass-list" id="passList"></ul>
				<button class="btn-create" type="button" id="btnCreate">Обновить</button>
				<p class="status" id="status" role="status" aria-live="polite"></p>
			</div>

			<div class="composition">
				<div class="comp-head">
					<h2 class="comp-title">Состав пароля</h2>
					<button class="link" type="button" id="btnReset">Сбросить</button>
				</div>
				<div id="groups"></div>
			</div>
		</main>
	</div>

	<footer class="footer">© <span id="year"></span> Генератор паролей</footer>

	<script src="js/pass-gen.js"></script>
</body>

</html>
